<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enter Domain</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Background image */
    #bg {
      position: fixed;
      width: 100%;
      height: 100%;
      object-fit: cover;
      top: 0;
      left: 0;
      z-index: -1;
      opacity: 1;
  transition: opacity 7s ease;

    }

    /* Popup box */
    #popup {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 30px;
      border: 2px solid white;
      text-align: center;
      display: none;
    }

    .button {
      margin: 15px;
      padding: 10px 20px;
      border: 1px solid white;
      cursor: pointer;
      display: inline-block;
    }

    .button:hover {
      background: white;
      color: black;
    }
  </style>
</head>
<body>

  <!-- Background image -->
  <img id="bg" src="docs/images/bg2.jpg" alt="background">

  <!-- Popup -->
  <div id="popup">
    <p>Greetings. Do wish to enter my domain?</p>
    <div class="button" onclick="enterSite()">Yes</div>
    <div class="button" onclick="denyAccess()">No</div>
  </div>

  <script>
    const bg = document.getElementById('bg');
    const popup = document.getElementById('popup');

    // Show popup once image loads
    bg.onload = () => {
      popup.style.display = 'block';
    };

   function enterSite() {
  // 1. Play music
  const audio = new Audio('images/greetings.mp3');
  audio.play();

  // 2. Fade out the background image
  const bg = document.getElementById('bg');
  bg.style.transition = "opacity 7s ease";
  bg.style.opacity = "0";

  // 3. Redirect after fade completes
  setTimeout(() => {
    window.location.href = "newsletter.html";
  }, 7000); // matches the fade duration
}

    function denyAccess() {
      alert("You chose wisely...");
      // Or close window / fade out / loop
    }
  </script>

</body>
</html>
